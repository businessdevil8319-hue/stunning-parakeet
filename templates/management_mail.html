<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Management Mail | Campus Mate</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .back {
            color: #aeb8ff;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 25px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .card {
            background: #151d3d;
            border: 1px solid #303b6b;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #aeb8dc;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            border: 1px solid #303b6b;
            border-radius: 10px;
            background: #0d1430;
            color: white;
            outline: none;
            font-size: 15px;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #6675f5;
        }

        select option {
            background: #151d3d;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6675f5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #7b88ff;
            transform: translateY(-2px);
        }

        .info {
            margin-top: 25px;
            padding: 18px;
            border-radius: 12px;
            background: #101833;
            border: 1px solid #29345f;
            color: #aeb8dc;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/management/dashboard" class="back">
        ← Back to Management Dashboard
    </a>

    <div class="card">

        <h1>📧 Management Mail</h1>

        <p class="subtitle">
            Send an official message to students or lecturers.
        </p>

        <form method="POST" action="/management/mail">

            <label for="recipient">
                Recipient
            </label>

            <select
                id="recipient"
                name="recipient"
                required
            >
                <option value="">
                    Select recipient
                </option>

                <option value="all_students">
                    All Students
                </option>

                <option value="all_lecturers">
                    All Lecturers
                </option>

                <option value="all">
                    Students & Lecturers
                </option>
            </select>


            <label for="subject">
                Subject
            </label>

            <input
                type="text"
                id="subject"
                name="subject"
                placeholder="Enter mail subject"
                required
            >


            <label for="message">
                Message
            </label>

            <textarea
                id="message"
                name="message"
                placeholder="Write your message here..."
                required
            ></textarea>


            <button type="submit">
                📤 Send Mail
            </button>

        </form>


        <div class="info">
            <strong>📌 Note:</strong><br>
            This mail will be sent as an official Campus Mate
            management message to the selected users.
        </div>

    </div>

</div>

</body>
</html>
