<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Management Login | Campus Mate</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                radial-gradient(
                    circle at top,
                    #3b2a0a,
                    #090909 55%,
                    #000000
                );

            color: white;

        }


        .login-container {

            width: 420px;

            max-width: 92%;

            padding: 45px 35px;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(212,175,55,0.35);

            border-radius: 24px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.6);

            backdrop-filter: blur(15px);

        }


        .logo {

            text-align: center;

            font-size: 42px;

            margin-bottom: 10px;

        }


        h1 {

            text-align: center;

            color: #f5d76e;

            font-size: 28px;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #aaa;

            font-size: 14px;

            margin-bottom: 30px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #ddd;

            font-size: 14px;

        }


        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            border-radius: 10px;

            border: 1px solid #444;

            background: rgba(0,0,0,0.45);

            color: white;

            outline: none;

        }


        input:focus {

            border-color: #d4af37;

            box-shadow:
                0 0 10px rgba(212,175,55,0.2);

        }


        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #b8860b,
                    #f5d76e
                );

            color: #111;

            font-weight: bold;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px
                rgba(212,175,55,0.3);

        }


        .security {

            text-align: center;

            margin-top: 25px;

            color: #888;

            font-size: 12px;

        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="logo">
        🛡️
    </div>


    <h1>
        Management Portal
    </h1>


    <p class="subtitle">
        Campus Mate Administration
    </p>


    <form
        method="POST"
        action="/management/login"
    >

        <label>
            Management Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter management email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            LOGIN TO MANAGEMENT
        </button>

    </form>


    <p class="security">
        🔐 Authorized Management Access Only
    </p>

</div>


</body>

</html>
